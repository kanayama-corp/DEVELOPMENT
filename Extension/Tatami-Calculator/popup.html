<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- メイン画面 -->
        <div id="mainView">
            <div class="header">
                <h2>畳計算機</h2>
                <button id="settingsBtn" class="settings-btn" title="設定">⚙️</button>
            </div>
            <div class="input-group">
                <label>長さ (mm):</label>
                <input type="number" id="length">
            </div>
            <div class="input-group">
                <label>幅 (mm):</label>
                <input type="number" id="width">
            </div>
            <div class="result" id="result">
                結果がここに表示されます
            </div>
        </div>

        <!-- 設定画面 -->
        <div id="settingsView" style="display: none;">
            <div class="header">
                <h2>計測方法設定</h2>
            </div>
            <div class="settings-content">
                <p class="settings-description">表示したい畳の計測方法を選択してください（複数選択可）：</p>
                <div id="methodCheckboxes" class="checkbox-container">
                </div>
                <div class="button-group">
                    <button id="saveBtn" class="btn btn-primary">保存</button>
                    <button id="cancelBtn" class="btn btn-secondary">キャンセル</button>
                </div>
            </div>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
