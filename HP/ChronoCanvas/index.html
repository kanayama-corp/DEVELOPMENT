<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrono Canvas - その一枚の、奥へ。</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
    <!-- Flickity carousel -->
    <link rel="stylesheet" href="https://unpkg.com/flickity@2/dist/flickity.min.css">
    <script src="https://unpkg.com/flickity@2/dist/flickity.pkgd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* カスタムスタイル */
        body {
            font-family: 'Inter', 'Noto Serif JP', serif;
            background-color: #000;
            color: #fff;
            perspective: 1000px;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            margin: 0;
            padding: 0;
            cursor: none;
            position: fixed;
            top: 0;
            left: 0;
        }

        #scene-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            transform-style: preserve-3d;
            transition: transform 3s cubic-bezier(0.25, 1, 0.5, 1);
        }
        
        #scene-rotator {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.5s ease-out;
        }

        .layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* 非アクティブレイヤーがクリックを邪魔しないように */
            pointer-events: none;
        }


        /* レイヤー6: 店内 */
        #layer-6 {
            transform: translateZ(-2000px);
            opacity: 0;
            /* ★遅延を削除し、スムーズなクロスフェードを可能に */
            transition: opacity 8s cubic-bezier(0.165, 0.84, 0.44, 1);
            border: none;
            outline: none;
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
        }

        /* レイヤー7: メッセージセクション */
        #layer-7 {
            transform: translateZ(-3000px);
            opacity: 0;
            transition: opacity 6s cubic-bezier(0.165, 0.84, 0.44, 1);
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            text-align: center;
        }

        #message-text {
            opacity: 0;
            transition: opacity 8s cubic-bezier(0.165, 0.84, 0.44, 1);
            text-align: center;
            line-height: 1.8;
            max-width: 1200px;
            padding: 0 40px;
            width: 100%;
        }

        .message-line {
            display: block;
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
            background: linear-gradient(135deg, #ffffff 0%, #e2e8f0 25%, #94a3b8 50%, #e2e8f0 75%, #ffffff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 300;
            letter-spacing: 0.1em;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .message-line:last-child {
            margin-bottom: 0;
            font-weight: 400;
            font-size: 2rem;
            white-space: nowrap;
        }
        #layer-6-bg {
            width: 110%;
            height: 110%;
            object-fit: cover;
            transform: scale(1.1);
            filter: brightness(0.8);
            border: none;
            outline: none;
        }
        
        #hello-text {
            opacity: 0;
            transition: opacity 6s cubic-bezier(0.165, 0.84, 0.44, 1);
            border: none;
            outline: none;
            text-align: center;
            white-space: nowrap;
            z-index: 1000;
        }

        .gradient-silver {
            background: linear-gradient(135deg, #ffffff 0%, #e2e8f0 25%, #94a3b8 50%, #e2e8f0 75%, #ffffff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* レイヤー5: 背景 */
        #layer-5 {
            transform: translateZ(-1500px);
            transition: opacity 2s ease-in-out;
        }
        #layer-5-bg {
            width: 120%;
            height: 120%;
            object-fit: cover;
            filter: blur(10px) brightness(0.6);
            transform: scale(1.1);
        }

        /* レイヤー4: メインアートワーク */
        #layer-4 {
            transform: translateZ(-1000px);
        }
        #layer-4-img {
            width: 160%;
            max-width: 1600px;
            height: auto;
            border-radius: 1rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75);
            transition: all 1.5s ease-in-out, opacity 1s ease-out 0.5s;
            outline: none; 
            backface-visibility: hidden;
        }
        
        /* レイヤー3: パーティクル */
        #layer-3 {
            transform-style: preserve-3d;
        }
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.8), 0 0 12px rgba(255, 199, 115, 0.7);
        }

        /* レイヤー2: タイトル */
        #layer-2 {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            transform: translateZ(0px);
        }
        
        /* レイヤー1: 前景 */
        #layer-1 {
            transform: translateZ(500px);
        }
        .foreground-element {
            position: absolute;
            background: radial-gradient(circle, rgba(28, 25, 23, 0.3) 0%, rgba(28, 25, 23, 0) 60%);
            filter: blur(15px);
            opacity: 0.7;
        }

        #custom-cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s, background-color 0.2s;
            z-index: 9999;
        }

        #bgm-toggle {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: white;
            border: 3px solid black;
            border-radius: 50%;
            color: black;
            font-size: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 10000;
        }

        #bgm-toggle:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: scale(1.1);
        }

        #bgm-toggle.off {
            opacity: 0.7;
        }

        /* スピーカーアイコンのSVG */
        .speaker-icon {
            width: 24px;
            height: 24px;
            fill: black;
        }

        /* --- Gallery (Flickity) Styles --- */
        .carousel {
            background: #111827; /* gray-900 */
            width: 90%;
            max-width: 1200px;
            border-radius: 12px;
            padding: 12px 0;
        }
        /* レイヤー8（ギャラリー）はクリック操作を有効化 */
        #layer-8 { pointer-events: auto; }
        #layer-8 * { pointer-events: auto; }
        .carousel-cell {
            width: auto;
            margin-right: 20px;
            overflow: hidden;
            border-radius: 8px;
        }
        .carousel-cell img {
            display: block;
            height: 200px;
        }
        @media screen and (min-width: 768px) {
            .carousel-cell img {
                height: 400px;
            }
        }

    </style>
</head>
<body class="bg-black">

    <div id="scene-container">
        <div id="scene-rotator">
            <div id="layer-7" class="layer">
                <div id="message-text">
                    <span class="message-line">一瞬は儚く、しかし無限に美しい。</span>
                    <span class="message-line">その瞬間を捉え</span>
                    <span class="message-line">永遠に輝き続けるアートピースとして昇華させる。</span>
                </div>
            </div>
            <!-- レイヤー8: ギャラリー（Flickity） -->
            <div id="layer-8" class="layer" style="opacity:0; transform: translateZ(-3500px); transition: opacity 2s cubic-bezier(0.165, 0.84, 0.44, 1);">
                <div class="carousel" data-flickity='{ "imagesLoaded": true, "percentPosition": false }'>
                    <div class="carousel-cell">
                        <img src="https://images.unsplash.com/photo-1549880338-65ddcdfd017b?q=80&w=2400&auto=format&fit=crop" alt="Cinematic skyline at dusk">
                    </div>
                    <div class="carousel-cell">
                        <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?q=80&w=2400&auto=format&fit=crop" alt="Abstract desert landscape">
                    </div>
                    <div class="carousel-cell">
                        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?q=80&w=2400&auto=format&fit=crop" alt="Moody mountain in clouds">
                    </div>
                    <div class="carousel-cell">
                        <img src="https://images.unsplash.com/photo-1500043357865-c6b8827edf36?q=80&w=2400&auto=format&fit=crop" alt="Long exposure city lights">
                    </div>
                    <div class="carousel-cell">
                        <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?q=80&w=2400&auto=format&fit=crop" alt="Forest light beams">
                    </div>
                </div>
            </div>
            <div id="layer-6" class="layer">
                <h2 id="hello-text" class="text-4xl md:text-6xl text-white font-serif">Welcome</h2>
            </div>
            <div id="layer-5" class="layer">
                
            </div>
            <div id="layer-4" class="layer">
                <img id="layer-4-img" src="image/hero.jpg" alt="">
            </div>
            <div id="layer-3" class="layer"></div>
            <div id="layer-2" class="layer transition-opacity duration-1000 ease-out">
                <div class="text-center text-white">
                    <h1 class="text-6xl md:text-8xl font-bold tracking-wider gradient-silver" style="font-family: 'Inter', sans-serif;">Chrono Canvas</h1>
                    <p class="mt-4 text-xl md:text-2xl" style="font-family: 'Noto Serif JP', serif;">その一枚の、奥へ。</p>
                </div>
            </div>
            <div id="layer-1" class="layer transition-opacity duration-1000 ease-out">
                <div class="foreground-element" style="top: -20%; left: -20%; width: 40%; height: 40%;"></div>
                <div class="foreground-element" style="top: -20%; right: -20%; width: 40%; height: 40%;"></div>
                <div class="foreground-element" style="bottom: -20%; left: -20%; width: 40%; height: 40%;"></div>
                <div class="foreground-element" style="bottom: -20%; right: -20%; width: 40%; height: 40%;"></div>
            </div>
        </div>
    </div>
    
    <div id="custom-cursor"></div>
    
    <button id="bgm-toggle" class="off">
        <svg class="speaker-icon" viewBox="0 0 24 24">
            <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM19 12c0 2.76-2.02 5.05-4.67 5.65v-1.6c1.84-.58 3.17-2.27 3.17-4.05 0-1.78-1.33-3.47-3.17-4.05v-1.6C16.98 6.95 19 9.24 19 12zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v1.6c1.16-.37 2.26-.99 3.18-1.8L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
        </svg>
    </button>


    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const scene = document.getElementById('scene-container');
            const rotator = document.getElementById('scene-rotator');
            const layer1 = document.getElementById('layer-1');
            const layer2 = document.getElementById('layer-2');
            const layer4Img = document.getElementById('layer-4-img');
            const layer5 = document.getElementById('layer-5');
            const layer6 = document.getElementById('layer-6');
            const layer7 = document.getElementById('layer-7');
            const layer8 = document.getElementById('layer-8');
            const helloText = document.getElementById('hello-text');
            const messageText = document.getElementById('message-text');
            const particleContainer = document.getElementById('layer-3');
            const cursor = document.getElementById('custom-cursor');
            const bgmToggle = document.getElementById('bgm-toggle');

            let scrollStage = 0;
            let isAnimating = false;
            let soundEnabled = false;
            let bgmEnabled = false;

            // --- Flickity Carousel Init (Gallery) ---
            const carouselEl = document.querySelector('#layer-8 .carousel');
            let flkty = null;
            let galleryImgs = [];
            const docStyle = document.documentElement.style;
            const transformProp = typeof docStyle.transform === 'string' ? 'transform' : 'WebkitTransform';

            const initGallery = () => {
                if (!carouselEl || flkty) return;
                flkty = new Flickity(carouselEl, {
                    imagesLoaded: true,
                    percentPosition: false,
                    wrapAround: true,
                    prevNextButtons: true,
                    pageDots: true,
                    cellAlign: 'left'
                });
                galleryImgs = Array.from(carouselEl.querySelectorAll('.carousel-cell img'));
                flkty.on('scroll', () => {
                    flkty.slides.forEach((slide, i) => {
                        const img = galleryImgs[i];
                        if (!img) return;
                        const x = (slide.target + flkty.x) * -1/3;
                        img.style[transformProp] = `translateX(${x}px)`;
                    });
                });
            };
            initGallery();
            
            // --- サウンド設定 ---
            let ambientSynth, noise, wind;
            
            const setupSound = () => {
                if (soundEnabled) return;
                Tone.start().then(() => {
                    // Create silent audio context to prevent browser speaker icon
                    const silentBuffer = Tone.context.createBuffer(1, 1, 22050);
                    const silentSource = Tone.context.createBufferSource();
                    silentSource.buffer = silentBuffer;
                    silentSource.connect(Tone.context.destination);
                    silentSource.start();
                    
                    ambientSynth = new Tone.PolySynth(Tone.AMSynth, { harmonicity: 1.5, envelope: { attack: 2, decay: 1, sustain: 0.5, release: 4 }, volume: -Infinity }).toDestination();
                    ambientSynth.set({ detune: -1200 });
                    noise = new Tone.Noise("pink").start();
                    const noiseFilter = new Tone.AutoFilter({ frequency: "8m", baseFrequency: 200, octaves: 3 }).toDestination();
                    noise.connect(noiseFilter);
                    noise.volume.value = bgmEnabled ? -35 : -Infinity;
                    wind = new Tone.Noise("white").toDestination();
                    wind.volume.value = -Infinity;
                    const notes = ["C2", "G2", "C3", "A3"];
                    let noteIndex = 0;
                    const playAmbient = () => {
                        if (bgmEnabled) {
                            ambientSynth.triggerAttackRelease(notes[noteIndex % notes.length], "8n");
                        }
                        noteIndex++;
                        setTimeout(playAmbient, Math.random() * 8000 + 5000);
                    }
                    playAmbient();
                    soundEnabled = true;
                });
            };

            // BGMトグル機能
            const toggleBGM = () => {
                bgmEnabled = !bgmEnabled;
                
                // SVGアイコンを切り替え
                const speakerIcon = bgmToggle.querySelector('.speaker-icon path');
                if (bgmEnabled) {
                    // ON: スピーカー + 音波
                    speakerIcon.setAttribute('d', 'M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z');
                    bgmToggle.className = '';
                } else {
                    // OFF: スピーカー + 斜線
                    speakerIcon.setAttribute('d', 'M16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM19 12c0 2.76-2.02 5.05-4.67 5.65v-1.6c1.84-.58 3.17-2.27 3.17-4.05 0-1.78-1.33-3.47-3.17-4.05v-1.6C16.98 6.95 19 9.24 19 12zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v1.6c1.16-.37 2.26-.99 3.18-1.8L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z');
                    bgmToggle.className = 'off';
                }
                
                if (soundEnabled) {
                    noise.volume.value = bgmEnabled ? -35 : -Infinity;
                    ambientSynth.volume.value = bgmEnabled ? -25 : -Infinity;
                } else {
                    setupSound();
                }
            };

            bgmToggle.addEventListener('click', toggleBGM);
            document.body.addEventListener('click', setupSound, { once: true });

            // --- パーティクル生成 ---
            const createParticles = () => {
                for (let i = 0; i < 100; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    const x = (Math.random() - 0.5) * 2500;
                    const y = (Math.random() - 0.5) * 2500;
                    const z = (Math.random() - 0.5) * 2000 - 500;
                    particle.style.transform = `translate3d(${x}px, ${y}px, ${z}px)`;
                    particleContainer.appendChild(particle);
                }
            };
            createParticles();

            // ギャラリー機能を削除


            // --- マウス操作（視差効果）---
            const handleMouseMove = (e) => {
                cursor.style.left = `${e.clientX}px`;
                cursor.style.top = `${e.clientY}px`;
                // scrollStage 2以上（WelcomeとMessageセクション）では常に中央固定
                if (scrollStage >= 2) {
                    rotator.style.transform = 'rotateX(0deg) rotateY(0deg)';
                    return;
                }
                const x = e.clientX / window.innerWidth - 0.5;
                const y = e.clientY / window.innerHeight - 0.5;
                rotator.style.transform = `rotateX(${-y * 10}deg) rotateY(${x * 10}deg)`;
            };

            // --- スクロール操作（前進・後退効果）---
            const handleScroll = (e) => {
                if (isAnimating) return;

                // --- 上スクロール（戻る）---
                if (e.deltaY < 0) {
                    if (scrollStage === 0) return;
                    isAnimating = true;
                    if (soundEnabled) {
                        wind.volume.rampTo(-20, 0.1);
                        setTimeout(() => wind.volume.rampTo(-Infinity, 2), 500);
                    }

                    switch (scrollStage) {
                        case 4: // ギャラリー -> メッセージ（戻る）
                            isAnimating = true;
                            // ギャラリーを消してメッセージへ
                            layer8.style.opacity = '0';
                            scene.style.transform = `translateZ(3000px)`;
                            setTimeout(() => {
                                layer7.style.opacity = '1';
                                messageText.style.opacity = '1';
                                scrollStage = 3;
                                isAnimating = false;
                            }, 1000);
                            break;
                        case 2: // Welcome -> アートワーク前（戻る）
                            // Welcomeを隠しつつ、アートワーク前の状態に戻す
                            helloText.style.transition = 'opacity 0.8s cubic-bezier(0.165, 0.84, 0.44, 1)';
                            helloText.style.opacity = '0';
                            // パララックスを復帰させるため、中央固定は解除（mousemoveが自動で効く）
                            scene.style.transform = `translateZ(1000px)`;
                            setTimeout(() => {
                                layer6.style.opacity = '0';
                                layer5.style.opacity = '1';
                                layer4Img.style.transform = 'scale(1)';
                                layer4Img.style.opacity = '1';
                                scrollStage = 1;
                                isAnimating = false;
                            }, 2000);
                            break;
                        case 3: // メッセージ -> Welcome（戻る）
                            // 1000msで戻る: 各トランジションを1s以内に短縮
                            layer7.style.transition = 'opacity 1s cubic-bezier(0.165, 0.84, 0.44, 1)';
                            messageText.style.transition = 'opacity 0.5s cubic-bezier(0.165, 0.84, 0.44, 1)';
                            helloText.style.transition = 'opacity 1s cubic-bezier(0.165, 0.84, 0.44, 1)';
                            // Welcomeレイヤー自体のフェードも早める（デフォルト8sを1sに）
                            layer6.style.transition = 'opacity 1s cubic-bezier(0.165, 0.84, 0.44, 1)';
                            messageText.style.opacity = '0';
                            // まずWelcome側をすぐ表示（メッセージがフェードしていく間も文字が見えるように）
                            layer6.style.opacity = '1';
                            helloText.style.opacity = '1';
                            setTimeout(() => {
                                layer7.style.opacity = '0';
                                scene.style.transform = `translateZ(2000px)`;
                                // 戻りでも即座に中央固定にする
                                rotator.style.transform = 'rotateX(0deg) rotateY(0deg)';
                                scrollStage = 2;
                                isAnimating = false;
                            }, 1000); // 1000msで戻る
                            break;
                        
                        case 1: // アートワーク前 -> 初期画面
                            scene.style.transform = `translateZ(0px)`;
                            setTimeout(() => {
                                layer1.style.opacity = '1';
                                layer2.style.opacity = '1';
                            }, 500);
                            setTimeout(() => {
                                isAnimating = false;
                                scrollStage = 0;
                            }, 3000);
                            break;
                    }
                }
                
                // --- 下スクロール（進む）---
                if (e.deltaY > 0) {
                    if (scrollStage >= 4) return;
                    isAnimating = true;
                    if (soundEnabled) {
                        wind.volume.rampTo(-20, 0.1);
                        setTimeout(() => wind.volume.rampTo(-Infinity, 2), 500);
                    }

                    switch (scrollStage) {
                        case 0: // 初期画面 -> アートワーク前
                            layer1.style.opacity = '0';
                            layer2.style.opacity = '0';
                            scene.style.transform = `translateZ(1000px)`;
                            setTimeout(() => {
                                scrollStage = 1;
                                isAnimating = false;
                            }, 2000);
                            break;
                        
                        case 1: // アートワーク前 -> Welcome
                            layer4Img.style.transform = 'scale(2)';
                            layer4Img.style.opacity = '0';
                            layer5.style.opacity = '0';
                            setTimeout(() => {
                                layer6.style.opacity = '1';
                                helloText.style.transition = 'opacity 6s cubic-bezier(0.165, 0.84, 0.44, 1)';
                                helloText.style.transitionDelay = '0s';
                                helloText.style.opacity = '1';
                            }, 1000);
                            scene.style.transform = `translateZ(2000px)`;
                            // Welcome開始時点で即座に中央固定にする
                            rotator.style.transform = 'rotateX(0deg) rotateY(0deg)';
                            // マウス移動なしでも中央表示されるよう、ステージを先に進める
                            scrollStage = 2;
                            setTimeout(() => {
                                isAnimating = false;
                            }, 2000);
                            break;

                        case 2: // Welcome -> メッセージ
                            // Helloテキストをゆっくりと消す
                            helloText.style.transition = 'opacity 1s cubic-bezier(0.165, 0.84, 0.44, 1)';
                            helloText.style.opacity = '0';
                            // 中央固定を維持
                            rotator.style.transform = 'rotateX(0deg) rotateY(0deg)';
                            scene.style.transform = `translateZ(3000px)`;
                            setTimeout(() => {
                                layer6.style.opacity = '0';
                                layer7.style.opacity = '1';
                                messageText.style.opacity = '1';

                                // 各行を段階的にフェードイン
                                const messageLines = document.querySelectorAll('.message-line');
                                messageLines.forEach((line, index) => {
                                    setTimeout(() => {
                                        line.style.opacity = '1';
                                    }, index * 2500); // 2.5秒間隔で表示（少し遅く）
                                });
                            }, 1000);
                            // メッセージ表示中でも次のセクションへ進めるよう、ロックを早めに解除
                            setTimeout(() => {
                                scrollStage = 3;
                                isAnimating = false;
                            }, 1500);
                            break;
                        case 3: // メッセージ -> ギャラリー
                            // メッセージを消し、ギャラリーを表示
                            messageText.style.opacity = '0';
                            layer7.style.opacity = '0';
                            // 中央固定のまま更に奥へ
                            rotator.style.transform = 'rotateX(0deg) rotateY(0deg)';
                            scene.style.transform = `translateZ(3500px)`;
                            setTimeout(() => {
                                layer8.style.opacity = '1';
                            }, 400);
                            setTimeout(() => {
                                scrollStage = 4;
                                isAnimating = false;
                            }, 1500);
                            break;
                    }
                }
            };

            window.addEventListener('mousemove', handleMouseMove);
            window.addEventListener('wheel', handleScroll);
        });
    </script>
</body>
</html>
