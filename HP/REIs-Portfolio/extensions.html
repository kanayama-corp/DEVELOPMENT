<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>拡張機能 | REI's Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg-color: #F0F4F8;
      --main-color: #FFFFFF;
      --text-color: #333333;
      --accent-color-1: #A0C4FF;
      --accent-color-2: #BDB2FF;
      --accent-color-3: #FFD6A5;
      --shadow-color: rgba(0, 0, 0, 0.08);
      --font-family: 'M PLUS Rounded 1c', sans-serif;
    }
    body {
      font-family: var(--font-family);
      background: linear-gradient(135deg, var(--accent-color-1), var(--accent-color-3));
      color: var(--text-color);
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      box-sizing: border-box;
    }
    .container {
      background: var(--main-color);
      max-width: 1100px;
      margin: 0 auto;
      border-radius: 24px;
      box-shadow: 0 10px 30px var(--shadow-color);
      padding: 28px;
    }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
    .brand { font-weight: 700; }
    .back { text-decoration: none; color: #1A73E8; font-weight: 500; }
    .title { font-size: 30.8px; font-weight: 700; margin: 10px 0 6px; }
    .desc { color: #666; margin: 0 0 18px; }

    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
    .card { background: #fff; border: 1px solid #E9E9EF; border-radius: 18px; padding: 24px; box-shadow: 0 8px 22px rgba(0,0,0,0.08); display: flex; flex-direction: column; gap: 14px; min-height: 106px; overflow: hidden; }
    .thumb { aspect-ratio: 16/9; margin: -24px -24px 12px -24px; display: block; background: none; border: 0; overflow: hidden; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 0; }
    .card h3 { font-size: 18px; margin: 0; }
    .card p { font-size: 14px; color: #666; margin: 0; }
    .actions { display: flex; gap: 10px; margin-top: auto; }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 14px; border-radius: 12px; font-size: 14px; text-decoration: none; border: 1px solid #E5E7EB; color: #1f2937; background: #fff; }
    .btn.primary { background: #EAE6FF; color: #6A1B9A; border-color: #D9D6FF; }

    /* Responsive: keep structure, optimize readability */
    @media (max-width: 1024px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .container { padding: 24px; }
      .title { font-size: 28px; }
    }
    @media (max-width: 640px) {
      .grid { grid-template-columns: 1fr; }
      .container { padding: 20px; }
      .title { font-size: 24px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <a class="back" href="index.html"><i class="fa-solid fa-arrow-left"></i> 戻る</a>
    </div>
    <h1 class="title">拡張機能</h1>

    <section class="grid">
      <article class="card">
        <div class="thumb">
          <img src="image/EX-1.jpg" alt="タタミ計算機のサムネイル"
               onerror="this.onerror=null; this.src='https://placehold.co/800x450/F4F6FA/9ba3af?text=EX-1.jpg';" />
        </div>
        <h3 style="text-align: center;">タタミ計算機</h3>
      </article>
      <article class="card">
        <div class="thumb">
          <img src="image/EX-2.jpg" alt="坪数計算機のサムネイル"
               onerror="this.onerror=null; this.src='https://placehold.co/800x450/F4F6FA/9ba3af?text=EX-2.jpg';" />
        </div>
        <h3 style="text-align: center;">坪数計算機</h3>
      </article>
    </section>
  </div>
</body>
</html>
