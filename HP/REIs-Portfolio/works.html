<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>作成HP | REI's Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg-color: #F0F4F8;
      --main-color: #FFFFFF;
      --text-color: #333333;
      --accent-color-1: #A0C4FF;
      --accent-color-2: #BDB2FF;
      --accent-color-3: #FFD6A5;
      --shadow-color: rgba(0, 0, 0, 0.08);
      --font-family: 'M PLUS Rounded 1c', sans-serif;
    }
    body {
      font-family: var(--font-family);
      background: linear-gradient(135deg, var(--accent-color-1), var(--accent-color-3));
      color: var(--text-color);
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      box-sizing: border-box;
    }
    .container {
      background: var(--main-color);
      max-width: 1100px;
      margin: 0 auto;
      border-radius: 24px;
      box-shadow: 0 10px 30px var(--shadow-color);
      padding: 28px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }
    .brand { font-weight: 700; }
    .back { text-decoration: none; color: #1A73E8; font-weight: 500; }
    .title { font-size: 30.8px; font-weight: 700; margin: 10px 0 6px; }
    .desc { color: #666; margin: 0 0 18px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px;
    }
    .card {
      background: #fff;
      border: 1px solid #E9E9EF;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 8px 22px rgba(0,0,0,0.08);
      display: flex; flex-direction: column; gap: 14px;
      min-height: 106px; /* reduced to about one-third */
      overflow: hidden; /* to clip edge-to-edge thumbnail with rounded corners */
    }
    .thumb {
      aspect-ratio: 16/9;
      /* Make the thumbnail reach card edges by canceling card padding */
      margin: -24px -24px 12px -24px;
      display: block;
      background: none;
      border: 0;
    }
    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 0; /* edge-to-edge inside card; card's radius will clip */
      display: block;
    }
    .card h3 { font-size: 18px; margin: 0; }
    .card p { font-size: 14px; color: #666; margin: 0; }
    .actions { display: flex; gap: 10px; margin-top: auto; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 14px; border-radius: 12px; font-size: 14px; text-decoration: none;
      border: 1px solid #E5E7EB; color: #1f2937; background: #fff;
    }
    .btn.primary { background: #E6F0FF; color: #1A73E8; border-color: #D0E2FF; }

    /* Responsive: keep structure, optimize readability */
    @media (max-width: 1024px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .container { padding: 24px; }
      .title { font-size: 28px; }
    }
    @media (max-width: 640px) {
      .grid { grid-template-columns: 1fr; }
      .container { padding: 20px; }
      .title { font-size: 24px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <a class="back" href="index.html"><i class="fa-solid fa-arrow-left"></i> 戻る</a>
    </div>
    <h1 class="title">作成HP</h1>

    <section class="grid">
      <!-- 4カラムのカード例 -->
      <article class="card">
        <a class="thumb" href="https://development-x3qw.vercel.app/" target="_blank" rel="noopener noreferrer">
          <img src="image/HP-1.jpg" alt="カメラマンサイト サムネイル" onerror="this.onerror=null; this.src='https://placehold.co/640x360/E0E7FF/6B7280?text=HP-1.jpg+not+found';">
        </a>
        <h3 style="text-align: center;">カメラマンサイト</h3>
      </article>
      <article class="card">
        <a class="thumb" href="https://development-w4j1.vercel.app/" target="_blank" rel="noopener noreferrer">
          <img src="image/HP-2.jpg" alt="インテリアコーディネーターサイト サムネイル" onerror="this.onerror=null; this.src='https://placehold.co/640x360/E0E7FF/6B7280?text=HP-2.jpg+not+found';">
        </a>
        <h3 style="text-align: center;">インテリアコーディネーターサイト</h3>
      </article>
      <article class="card">
        <a class="thumb" href="https://development-7zva.vercel.app/" target="_blank" rel="noopener noreferrer">
          <img src="image/HP-3.jpg" alt="ヘッドスパサイト サムネイル" onerror="this.onerror=null; this.src='https://placehold.co/640x360/E0E7FF/6B7280?text=HP-3.jpg+not+found';">
        </a>
        <h3 style="text-align: center;">ヘッドスパサイト</h3>
      </article>
      <article class="card">
        <a class="thumb" href="https://development-grqx.vercel.app/" target="_blank" rel="noopener noreferrer">
          <img src="image/HP-4.jpg" alt="美容室サイト サムネイル" onerror="this.onerror=null; this.src='https://placehold.co/640x360/E0E7FF/6B7280?text=HP-4.jpg+not+found';">
        </a>
        <h3 style="text-align: center;">美容室サイト</h3>
      </article>
    </section>
  </div>
</body>
</html>
